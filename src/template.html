<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="left">
      <div id="creating_project">
        <div class="titles">
          <img src="" alt="Icons" />
          <div class="headings">
            <h1>Todo Manager</h1>

            <ul>
              <li>Plan</li>
              <li>Organize</li>
              <li>Achieve</li>
            </ul>
          </div>
        </div>
        <div id="create_project">
          <form id="project-form" action="" method="POST">
            <label for="project-name"></label>
            <input
              type="text"
              name="project_name"
              id="project-name"
              placeholder="Enter project name..."
              required
            />

            <button type="submit">+ New Project</button>
          </form>
        </div>
      </div>

      <div id="available_projects"></div>

      <div id="view_all_projects">
        <button id="viewallprojects">
          <h2>View all projects</h2>
        </button>
      </div>
    </div>
    <div id="right">
      <section class="search"></section>
      <section id="visuals">
        <div id="todo">
          <div id="control_section">
              <form id="todo-form">
                <h2>Create New Todo</h2>
                <!-- Todo title -->
                <label for="title">Title</label>
                <input
                  type="text"
                  id="title"
                  name="title"
                  placeholder="Enter todo title"
                  required
                />

                <!-- Description -->
                <label for="description">Description</label>
                <textarea
                  id="description"
                  name="description"
                  placeholder="Describe your task"
                  required
                ></textarea>

                <!-- Due date -->
                <label for="dueDate">Due Date</label>
                <input
                  type="date"
                  id="dueDate"
                  name="dueDate"
                  required
                />

                <!-- Priority -->
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                  <option value="high">High</option>
                  <option value="medium" selected>Medium</option>
                  <option value="low">Low</option>
                </select>

                <!-- Notes -->
                <label for="notes">Notes</label>
                <textarea
                  id="notes"
                  name="notes"
                  placeholder="Additional notes (optional)"
                ></textarea>

                <!-- Checklist -->
                <label for="checklist">
                  <input
                    type="checkbox"
                    id="checklist"
                    name="checklist"
                    value="true"
                  />
                  Add as checklist
                </label>

                <button type="submit">Create Todo</button>
              </form>

          </div>
          <div id="view_sections"></div>
        </div>
        <div id="todo_details"></div>
      </section>
    </div>
  </body>
</html>
