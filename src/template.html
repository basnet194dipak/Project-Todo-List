<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="left">
        <div id="creating_project">
            <div class="titles">
                <img src="" alt="Icons">
                <div class="headings">
                    <h1>Todo Manager</h1>
                    <p>
                        <ul>
                            <li>Plan</li>
                            <li>
                                Organize
                            </li>
                            <li>
                                Achieve
                            </li>
                        </ul>
                    </p>
                </div>
            </div>
            <div id="create_project">
                <form  id="project-form" action="" method="POST">
                    <label for="project-name"></label>
                    <input
                        type="text"
                        name="project_name"
                        id="project-name"
                        placeholder="Enter project name..."
                        required
                    >

                    <button type="submit">
                        + New Project
                    </button>
                </form>
                
            </div>
        </div>

        <div id="view_projects">

        </div>

        <div id="view_all_projects">
            <div id="available_projects">
                
            </div>
           <button>
                <h2> View all projects</h2>
           </button>
        </div>
    </div>
    <div id="right">
        <section class="search"></section>
        <section id="visuals">
            <div id="todo">
                <div id="control_section"></div>
                <div id="view_sections"></div>
            </div>
            <div id="todo_details"></div>
        </section>
    </div>
</body>
</html>
